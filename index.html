<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brojac Novca</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 0 14px 60px;
            min-height: 100vh;
        }

        .app-header {
            text-align: center;
            padding: 22px 0 14px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 6px;
        }

        .app-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: 0.5px;
        }

        .app-header p {
            font-size: 0.72rem;
            color: #475569;
            margin-top: 3px;
        }

        .section-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 18px 2px 8px;
            color: #64748b;
        }

        .section-label span { padding-bottom: 3px; border-bottom: 2px solid; }
        .rsd-label span { border-color: #d4a017; color: #d4a017; }
        .eur-label span { border-color: #4a90d9; color: #4a90d9; }
        .km-label  span { border-color: #34d399; color: #34d399; }

        /* CARD */
        .note-card {
            display: flex;
            align-items: center;
            background: #1e293b;
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
            border: 1px solid #263347;
            transition: border-color 0.15s;
            cursor: pointer;
            user-select: none;
        }

        .note-card.active     { border-color: #d4a017; }
        .note-card.active-eur { border-color: #4a90d9; }
        .note-card.active-km  { border-color: #34d399; }

        .note-face {
            width: 88px;
            height: 62px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .note-face .nv {
            font-size: 1.3rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.5px;
        }

        .note-face .nc {
            font-size: 0.58rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 3px;
            opacity: 0.65;
        }

        /* RSD colors */
        .r10   { background: #1a1430; color: #a78bfa; }
        .r20   { background: #0d2218; color: #4ade80; }
        .r50   { background: #0d1f3c; color: #60a5fa; }
        .r100  { background: #0c1c2e; color: #38bdf8; }
        .r200  { background: #2a1800; color: #fb923c; }
        .r500  { background: #2a0a0a; color: #f87171; }
        .r1000 { background: #160d2e; color: #818cf8; }
        .r2000 { background: #0f1f33; color: #7dd3fc; }
        .r5000 { background: #2a0a1e; color: #f472b6; }

        /* EUR colors */
        .e5    { background: #1a1e24; color: #94a3b8; }
        .e10   { background: #2a1000; color: #fdba74; }
        .e20   { background: #0d1f3c; color: #60a5fa; }
        .e50   { background: #2a1400; color: #fb923c; }
        .e100  { background: #0c2010; color: #4ade80; }
        .e200  { background: #241a00; color: #fbbf24; }
        .e500  { background: #1a0a2a; color: #c084fc; }

        /* KM colors */
        .k1    { background: #0a2018; color: #6ee7b7; }
        .k2    { background: #082016; color: #34d399; }
        .k5    { background: #0a2410; color: #4ade80; }
        .k10   { background: #0d2a14; color: #86efac; }
        .k20   { background: #0a1e1a; color: #5eead4; }
        .k50   { background: #071a14; color: #2dd4bf; }
        .k100  { background: #0a2218; color: #34d399; }
        .k200  { background: #081c10; color: #6ee7b7; }

        .note-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .note-sub .lbl {
            font-size: 0.68rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .note-sub .val {
            font-size: 0.95rem;
            font-weight: 700;
            color: #e2e8f0;
            margin-top: 2px;
        }

        .note-qty { text-align: right; }

        .note-qty .lbl {
            font-size: 0.68rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .note-qty .qty-val {
            font-size: 1.35rem;
            font-weight: 800;
            color: #94a3b8;
            margin-top: 1px;
            min-width: 42px;
            text-align: right;
        }

        .note-qty .qty-val.has-value { color: #f1f5f9; }

        /* DIVIDER */
        .divider { height: 1px; background: #1e293b; margin: 18px 0; }

        /* TOTALS */
        .totals-box {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #263347;
            overflow: hidden;
            margin-top: 20px;
        }

        .totals-box .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 16px;
            border-bottom: 1px solid #263347;
            font-size: 0.88rem;
        }

        .totals-box .row:last-child { border-bottom: none; }
        .totals-box .row .lbl { color: #64748b; }
        .totals-box .row .val { font-weight: 700; color: #e2e8f0; }

        .grand-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #152033;
            border-radius: 12px;
            border: 1px solid #1d3252;
            margin-top: 10px;
        }

        .grand-row .lbl {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .grand-row .val {
            font-size: 1.5rem;
            font-weight: 800;
            color: #d4a017;
        }

        .btn-reset {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: transparent;
            color: #475569;
            border: 1px solid #263347;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .rate-note {
            text-align: center;
            font-size: 0.68rem;
            color: #334155;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        /* =====================
           INPUT OVERLAY (native keyboard)
        ===================== */
        .input-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0);
            z-index: 10;
            pointer-events: none;
            transition: background 0.2s;
        }

        .input-overlay.open {
            background: rgba(0,0,0,0.5);
            pointer-events: all;
        }

        .input-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #111827;
            border-top: 1px solid #1e293b;
            border-radius: 20px 20px 0 0;
            padding: 0 16px 32px;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 20;
        }

        .input-sheet.open {
            transform: translateY(0);
        }

        .input-handle {
            width: 36px;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            margin: 10px auto 14px;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 14px;
        }

        .input-header .denom-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-header .btn-ok {
            background: #d4a017;
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 8px 22px;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .input-header .btn-ok.eur-ok { background: #4a90d9; }
        .input-header .btn-ok.km-ok  { background: #34d399; color: #0a2018; }

        .qty-input-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty-input-wrap label {
            font-size: 0.72rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        #qty-input {
            flex: 1;
            background: #1e293b;
            border: 2px solid #263347;
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 2rem;
            font-weight: 800;
            padding: 10px 14px;
            text-align: right;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        #qty-input:focus {
            border-color: #d4a017;
        }

        #qty-input.eur-focus:focus { border-color: #4a90d9; }
        #qty-input.km-focus:focus  { border-color: #34d399; }
    </style>
</head>
<body>

<div class="app-header">
    <h1>Brojac Novca</h1>
    <p>Tapni na apoen da unesete kolicinu</p>
</div>

<div class="section-label rsd-label"><span>Srpski Dinari — RSD</span></div>
<div id="rsd-box"></div>

<div class="divider"></div>

<div class="section-label eur-label"><span>Euri — EUR</span></div>
<div id="eur-box"></div>

<div class="divider"></div>

<div class="section-label km-label"><span>Konvertibilne Marke — KM</span></div>
<div id="km-box"></div>

<div class="totals-box">
    <div class="row"><span class="lbl">Ukupno dinari</span><span class="val" id="t-rsd">0 RSD</span></div>
    <div class="row"><span class="lbl">Ukupno euri</span><span class="val" id="t-eur">0 EUR</span></div>
    <div class="row"><span class="lbl">Euri u dinare (×117)</span><span class="val" id="t-eur-rsd">0 RSD</span></div>
    <div class="row"><span class="lbl">Ukupno marke</span><span class="val" id="t-km">0 KM</span></div>
    <div class="row"><span class="lbl">Marke u dinare (×58)</span><span class="val" id="t-km-rsd">0 RSD</span></div>
</div>

<div class="grand-row">
    <span class="lbl">Ukupno sve</span>
    <span class="val" id="t-grand">0 RSD</span>
</div>

<button class="btn-reset" onclick="resetAll()">Resetuj sve</button>
<p class="rate-note">Kurs: 1 EUR = 117 RSD &nbsp;|&nbsp; 1 KM = 58 RSD</p>

<!-- INPUT OVERLAY (native keyboard) -->
<div class="input-overlay" id="overlay" onclick="closeSheet()"></div>

<div class="input-sheet" id="input-sheet">
    <div class="input-handle"></div>
    <div class="input-header">
        <span class="denom-name" id="inp-denom-name">—</span>
        <button class="btn-ok" id="inp-ok" onclick="confirmInput()">OK</button>
    </div>
    <div class="qty-input-wrap">
        <label>Kom</label>
        <input id="qty-input" type="number" inputmode="numeric" pattern="[0-9]*"
               min="0" max="99999" placeholder="0"
               onkeydown="if(event.key==='Enter') confirmInput()">
    </div>
</div>

<script>
var rsdNotes = [
    {v:10,   lbl:'10',    css:'r10'},
    {v:20,   lbl:'20',    css:'r20'},
    {v:50,   lbl:'50',    css:'r50'},
    {v:100,  lbl:'100',   css:'r100'},
    {v:200,  lbl:'200',   css:'r200'},
    {v:500,  lbl:'500',   css:'r500'},
    {v:1000, lbl:'1.000', css:'r1000'},
    {v:2000, lbl:'2.000', css:'r2000'},
    {v:5000, lbl:'5.000', css:'r5000'}
];

var eurNotes = [
    {v:5,   lbl:'5',   css:'e5'},
    {v:10,  lbl:'10',  css:'e10'},
    {v:20,  lbl:'20',  css:'e20'},
    {v:50,  lbl:'50',  css:'e50'},
    {v:100, lbl:'100', css:'e100'},
    {v:200, lbl:'200', css:'e200'},
    {v:500, lbl:'500', css:'e500'}
];

var kmNotes = [
    {v:1,   lbl:'1',   css:'k1'},
    {v:2,   lbl:'2',   css:'k2'},
    {v:5,   lbl:'5',   css:'k5'},
    {v:10,  lbl:'10',  css:'k10'},
    {v:20,  lbl:'20',  css:'k20'},
    {v:50,  lbl:'50',  css:'k50'},
    {v:100, lbl:'100', css:'k100'},
    {v:200, lbl:'200', css:'k200'}
];

var data = {};
var activeKey = null;
var activeType = 'rsd'; // 'rsd' | 'eur' | 'km'

function fmt(n) { return n.toLocaleString('sr-RS'); }

function buildCards(boxId, notes, prefix, cur, type) {
    var box = document.getElementById(boxId);
    for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        var key = prefix + n.v;
        data[key] = 0;
        var card = document.createElement('div');
        card.className = 'note-card';
        card.id = 'card-' + key;
        card.setAttribute('data-key', key);
        card.setAttribute('data-val', n.v);
        card.setAttribute('data-cur', cur);
        card.setAttribute('data-lbl', n.lbl + ' ' + cur);
        card.setAttribute('data-type', type);
        card.innerHTML =
            '<div class="note-face ' + n.css + '">' +
                '<div class="nv">' + n.lbl + '</div>' +
                '<div class="nc">' + cur + '</div>' +
            '</div>' +
            '<div class="note-body">' +
                '<div class="note-sub">' +
                    '<div class="lbl">Iznos</div>' +
                    '<div class="val" id="sub-' + key + '">0 ' + cur + '</div>' +
                '</div>' +
                '<div class="note-qty">' +
                    '<div class="lbl">Kom</div>' +
                    '<div class="qty-val" id="qty-' + key + '">0</div>' +
                '</div>' +
            '</div>';
        card.addEventListener('click', function() {
            openSheet(
                this.getAttribute('data-key'),
                this.getAttribute('data-lbl'),
                this.getAttribute('data-type')
            );
        });
        box.appendChild(card);
    }
}

buildCards('rsd-box', rsdNotes, 'rsd', 'RSD', 'rsd');
buildCards('eur-box', eurNotes, 'eur', 'EUR', 'eur');
buildCards('km-box',  kmNotes,  'km',  'KM',  'km');

function openSheet(key, label, type) {
    if (activeKey) {
        var prev = document.getElementById('card-' + activeKey);
        if (prev) prev.classList.remove('active', 'active-eur', 'active-km');
    }
    activeKey = key;
    activeType = type;

    var card = document.getElementById('card-' + key);
    if (type === 'eur') card.classList.add('active-eur');
    else if (type === 'km') card.classList.add('active-km');
    else card.classList.add('active');

    document.getElementById('inp-denom-name').textContent = label;

    var okBtn = document.getElementById('inp-ok');
    okBtn.className = 'btn-ok';
    if (type === 'eur') okBtn.classList.add('eur-ok');
    else if (type === 'km') okBtn.classList.add('km-ok');

    var inp = document.getElementById('qty-input');
    inp.className = '';
    if (type === 'eur') inp.classList.add('eur-focus');
    else if (type === 'km') inp.classList.add('km-focus');

    inp.value = data[key] > 0 ? data[key] : '';

    document.getElementById('overlay').classList.add('open');
    document.getElementById('input-sheet').classList.add('open');

    // Focus input so phone keyboard opens immediately
    setTimeout(function() { inp.focus(); inp.select(); }, 80);
}

function closeSheet() {
    if (activeKey) {
        var prev = document.getElementById('card-' + activeKey);
        if (prev) prev.classList.remove('active', 'active-eur', 'active-km');
    }
    activeKey = null;
    document.getElementById('qty-input').blur();
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('input-sheet').classList.remove('open');
}

function confirmInput() {
    if (!activeKey) return;
    var raw = document.getElementById('qty-input').value;
    var qty = Math.max(0, parseInt(raw) || 0);
    data[activeKey] = qty;

    var qtyEl = document.getElementById('qty-' + activeKey);
    qtyEl.textContent = qty;
    qtyEl.className = 'qty-val' + (qty > 0 ? ' has-value' : '');

    var card = document.getElementById('card-' + activeKey);
    var denomVal = parseInt(card.getAttribute('data-val'));
    var cur = card.getAttribute('data-cur');
    var sub = qty * denomVal;
    document.getElementById('sub-' + activeKey).textContent = fmt(sub) + ' ' + cur;

    calc();
    closeSheet();
}

function calc() {
    var totalRSD = 0;
    for (var i = 0; i < rsdNotes.length; i++) {
        totalRSD += (data['rsd' + rsdNotes[i].v] || 0) * rsdNotes[i].v;
    }

    var totalEUR = 0;
    for (var j = 0; j < eurNotes.length; j++) {
        totalEUR += (data['eur' + eurNotes[j].v] || 0) * eurNotes[j].v;
    }

    var totalKM = 0;
    for (var k = 0; k < kmNotes.length; k++) {
        totalKM += (data['km' + kmNotes[k].v] || 0) * kmNotes[k].v;
    }

    var eurInRSD = totalEUR * 117;
    var kmInRSD  = totalKM  * 58;
    var grand    = totalRSD + eurInRSD + kmInRSD;

    document.getElementById('t-rsd').textContent     = fmt(totalRSD)  + ' RSD';
    document.getElementById('t-eur').textContent     = fmt(totalEUR)  + ' EUR';
    document.getElementById('t-eur-rsd').textContent = fmt(eurInRSD)  + ' RSD';
    document.getElementById('t-km').textContent      = fmt(totalKM)   + ' KM';
    document.getElementById('t-km-rsd').textContent  = fmt(kmInRSD)   + ' RSD';
    document.getElementById('t-grand').textContent   = fmt(grand)     + ' RSD';
}

function resetAll() {
    for (var k in data) { data[k] = 0; }

    var allNotes = [
        {notes: rsdNotes, prefix: 'rsd', cur: 'RSD'},
        {notes: eurNotes, prefix: 'eur', cur: 'EUR'},
        {notes: kmNotes,  prefix: 'km',  cur: 'KM'}
    ];

    allNotes.forEach(function(group) {
        group.notes.forEach(function(n) {
            var key = group.prefix + n.v;
            document.getElementById('qty-' + key).textContent = '0';
            document.getElementById('qty-' + key).className = 'qty-val';
            document.getElementById('sub-' + key).textContent = '0 ' + group.cur;
        });
    });

    document.getElementById('t-rsd').textContent     = '0 RSD';
    document.getElementById('t-eur').textContent     = '0 EUR';
    document.getElementById('t-eur-rsd').textContent = '0 RSD';
    document.getElementById('t-km').textContent      = '0 KM';
    document.getElementById('t-km-rsd').textContent  = '0 RSD';
    document.getElementById('t-grand').textContent   = '0 RSD';
}
</script>
</body>
</html>
